
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faisal Alsanea | HR Specialist & Operations Expert</title>
  <meta name="description" content="Professional portfolio of Faisal Alsanea, HR Specialist and Operations Expert specializing in Talent Acquisition and Saudi Labor compliance.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Thmanyah Sans', 'Readex Pro', 'sans-serif'],
          },
          colors: {
            midnight: '#05070A',
            solarized: '#002b36',
          }
        },
      },
    }
  </script>
  
  <style>
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('/fonts/thmanyahsans-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('/fonts/thmanyahsans-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('/fonts/thmanyahsans-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('/fonts/thmanyahsans-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('/fonts/thmanyahsans-Black.woff2') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root { scroll-behavior: smooth; }
    .bg-dot-pattern {
      background-image: radial-gradient(rgba(0, 0, 0, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .dark .bg-dot-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
    .glass-nav {
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @media (max-width: 768px) {
      .stats-grid { display: flex; flex-direction: column; }
    }
  </style>
  
  <script type="importmap">
  {
    "imports": {
      "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
      "framer-motion": "https://esm.sh/framer-motion@^12.30.0",
      "react": "https://esm.sh/react@^19.2.4",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
      "react/": "https://esm.sh/react@^19.2.4/"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="selection:bg-emerald-500/30 overflow-x-hidden">
  <div id="root"></div>

</body>
</html>
